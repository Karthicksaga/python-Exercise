<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <title>Chennai Open World</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; overscroll-behavior: none; }
      #stage { position: fixed; inset: 0; }
      #view { width: 100%; height: 100%; display: block; touch-action: none; }

      /*
       * Loading screen. Plain HTML and CSS so it is the very first frame, before the game's script
       * has been read; packages/ui/src/LoadingScreen.ts takes it over (steps, tips, street sketch).
       */
      #loading {
        --amber: #ffb703; --text: #f4f1ea; --muted: rgba(244, 241, 234, .66);
        position: fixed; inset: 0; z-index: 50; overflow: hidden; color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(120% 70% at 70% 105%, rgba(255, 138, 61, .30) 0%, rgba(255, 138, 61, 0) 60%),
          radial-gradient(90% 60% at 15% -10%, rgba(64, 86, 170, .35) 0%, rgba(64, 86, 170, 0) 70%),
          linear-gradient(180deg, #0a0d1c 0%, #0d1020 55%, #1a1416 100%);
        display: grid; grid-template-columns: 1fr auto; grid-template-rows: 1fr auto;
        padding: max(22px, env(safe-area-inset-top)) max(26px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(26px, env(safe-area-inset-left));
        gap: 16px 32px; box-sizing: border-box;
      }
      #loading[data-state="done"] { opacity: 0; pointer-events: none; }
      /* While it fades over the first frames of the game, nothing in it moves. */
      #loading[data-state="done"] *, #loading[data-state="done"] *::before, #loading[data-state="done"] *::after { animation: none !important; }
      /* Nothing on this screen loops or fades (23 Nov 2026): on a phone short of GPU memory each
         animated element became a layer of its own that could not be drawn (white boxes), and
         the game is busiest exactly while this screen shows. */
      #loading .ld-map { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
      #loading .ld-map.drawn { opacity: .9; }
      #loading .ld-shade { position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(90deg, rgba(7, 9, 15, .88) 0%, rgba(7, 9, 15, .35) 45%, rgba(7, 9, 15, .15) 100%),
          linear-gradient(0deg, rgba(7, 9, 15, .92) 0%, rgba(7, 9, 15, 0) 42%),
          radial-gradient(140% 120% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .55) 100%); }
      #loading > :not(.ld-map):not(.ld-shade) { position: relative; }
      #loading .ld-brand { grid-column: 1 / -1; align-self: start; animation: ld-rise .9s cubic-bezier(.2, .7, .2, 1) both; }
      #loading .ld-tamil { display: block; font: 700 15px "CowStationTamil", "Noto Sans Tamil", sans-serif; color: var(--amber); letter-spacing: .04em; margin-bottom: 6px; }
      #loading .ld-tamil[hidden] { display: none; }
      #loading .ld-title { margin: 0; line-height: .92; font-weight: 900; letter-spacing: -.01em; text-transform: uppercase; }
      #loading .ld-title span { display: block; }
      #loading .ld-title .ld-w1 { font-size: clamp(34px, 7.2vw, 88px); text-shadow: 0 6px 30px rgba(0, 0, 0, .55); }
      #loading .ld-title .ld-w2 { font-size: clamp(13px, 2vw, 24px); font-weight: 700; letter-spacing: .52em; color: var(--amber); margin-top: 8px; }
      #loading .ld-tag { margin: 12px 0 0; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
      #loading .ld-tip { align-self: end; max-width: 46ch; border-left: 3px solid var(--amber); padding: 4px 0 4px 14px; }
      #loading .ld-tip small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .3em; color: var(--amber); margin-bottom: 4px; text-transform: uppercase; }
      #loading .ld-tip-text { margin: 0; font-size: 14px; line-height: 1.45; color: var(--text); min-height: 2.9em; }
      #loading .ld-status { align-self: end; justify-self: end; width: min(300px, 42vw); text-align: right; }
      #loading .ld-step { margin: 0 0 9px; font-size: 13px; font-weight: 600; letter-spacing: .02em; min-height: 1.3em; }
      #loading .ld-bar { position: relative; display: flex; gap: 4px; height: 4px; }
      /* Before the first step: a dim bar (working, no percentage). Then one segment per step: a
         finished step is filled, the one running is a third filled. No animation (see above). */
      #loading .ld-bar:not(.ld-bar-steps) { background: rgba(255, 255, 255, .12); }
      #loading .ld-bar:not(.ld-bar-steps)::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: rgba(255, 183, 3, .45); }
      #loading .ld-bar i { flex: 1; position: relative; background: rgba(255, 255, 255, .14); }
      #loading .ld-bar i::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--amber); }
      #loading .ld-bar i.active::before { width: 34%; opacity: .7; }
      #loading .ld-bar i.done::before { width: 100%; opacity: 1; }
      #loading .ld-credit { margin: 10px 0 0; font-size: 10px; color: var(--muted); letter-spacing: .04em; }
      #loading .ld-error { margin: 10px 0 0; font-size: 12px; color: #ffb4a8; line-height: 1.4; }
      #loading .ld-retry { margin-top: 12px; min-height: 46px; min-width: 160px; padding: 0 22px; border: 0; border-radius: 4px;
        background: var(--amber); color: #14110a; font: 800 14px system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
      #loading .ld-retry:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      #loading[data-state="error"] .ld-bar i { background: rgba(255, 93, 93, .35); }

      /* Portrait, or very narrow: stack everything in one column. */
      @media (max-aspect-ratio: 1/1) {
        #loading { grid-template-columns: 1fr; grid-template-rows: 1fr auto auto; }
        #loading .ld-status { justify-self: stretch; width: auto; text-align: left; }
        #loading .ld-shade { background: linear-gradient(0deg, rgba(7, 9, 15, .94) 0%, rgba(7, 9, 15, .2) 60%, rgba(7, 9, 15, .7) 100%); }
      }
      /* Short landscape phones: a smaller wordmark so the tip and bar keep their room. */
      @media (max-height: 430px) and (min-aspect-ratio: 1/1) {
        #loading .ld-title .ld-w1 { font-size: clamp(30px, 6vw, 52px); }
        #loading .ld-tag { margin-top: 8px; }
      }
      @keyframes ld-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #loading, #loading * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <div id="loading">
      <canvas class="ld-map" aria-hidden="true"></canvas>
      <div class="ld-shade" aria-hidden="true"></div>
      <header class="ld-brand">
        <span class="ld-tamil" lang="ta" hidden>சென்னை</span>
        <h1 class="ld-title"><span class="ld-w1">Chennai</span><span class="ld-w2">Open World</span></h1>
        <p class="ld-tag">Explore the city. Live the experience.</p>
      </header>
      <aside class="ld-tip" aria-label="Tip"><small>Tip</small><p class="ld-tip-text"></p></aside>
      <div class="ld-status">
        <p class="ld-step" role="status" aria-live="polite">Starting the game…</p>
        <div class="ld-bar" role="progressbar" aria-label="Loading the city"></div>
        <p class="ld-credit">Map data © OpenStreetMap contributors</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
