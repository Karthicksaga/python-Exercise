<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Chennai Open World</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1220; overscroll-behavior: none; }
      #stage { position: fixed; inset: 0; }
      #view { width: 100%; height: 100%; display: block; touch-action: none; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #fff; font: 600 15px system-ui, sans-serif; background: #0f1220; text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <div id="loading" role="status">Loading Anna Nagar…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
