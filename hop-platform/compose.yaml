name: hop
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hop
      POSTGRES_DB: hop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hop -d hop]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?Set a unique Redis password}', --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    restart: unless-stopped
  migrate:
    build: .
    image: hop-app:local
    command: [migrate]
    environment:
      DATABASE_URL: postgres://hop:${POSTGRES_PASSWORD}@postgres:5432/hop?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  api:
    image: hop-app:local
    environment:
      APP_ENV: production
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DATABASE_URL: postgres://hop:${POSTGRES_PASSWORD}@postgres:5432/hop?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set HTTPS origin}
      RIDER_ORIGIN: ${PUBLIC_ORIGIN:?Set rider HTTPS origin}
      CAPTAIN_ORIGIN: https://${CAPTAIN_HOST:?Set captain hostname}
      ADMIN_ORIGIN: https://${ADMIN_HOST:?Set admin hostname}
      SESSION_KEY: ${SESSION_KEY:?Set session key}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set identity issuer}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set identity client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set identity client secret}
      ROUTING_URL: ${ROUTING_URL:?Set real road routing service}
      GEOCODING_URL: ${GEOCODING_URL:?Set Photon-compatible geocoding service}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/api, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 5
  rider:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        HOP_APP: rider
        VITE_RIDER_URL: ${PUBLIC_ORIGIN}
        VITE_CAPTAIN_URL: https://${CAPTAIN_HOST}
        VITE_ADMIN_URL: https://${ADMIN_HOST}
        VITE_MAP_PROVIDER: ${RIDER_MAP_PROVIDER:-google}
        VITE_GOOGLE_MAPS_API_KEY: ${RIDER_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAP_ID: ${RIDER_GOOGLE_MAP_ID:-}
    environment:
      HOP_APP: rider
      BACKEND_UPSTREAM: api:8080
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  captain:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        HOP_APP: captain
        VITE_RIDER_URL: ${PUBLIC_ORIGIN}
        VITE_CAPTAIN_URL: https://${CAPTAIN_HOST}
        VITE_ADMIN_URL: https://${ADMIN_HOST}
        VITE_MAP_PROVIDER: ${CAPTAIN_MAP_PROVIDER:-google}
        VITE_GOOGLE_MAPS_API_KEY: ${CAPTAIN_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAP_ID: ${CAPTAIN_GOOGLE_MAP_ID:-}
    environment:
      HOP_APP: captain
      BACKEND_UPSTREAM: api:8080
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  admin:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        HOP_APP: admin
        VITE_RIDER_URL: ${PUBLIC_ORIGIN}
        VITE_CAPTAIN_URL: https://${CAPTAIN_HOST}
        VITE_ADMIN_URL: https://${ADMIN_HOST}
        VITE_MAP_PROVIDER: ${ADMIN_MAP_PROVIDER:-osm}
        VITE_GOOGLE_MAPS_API_KEY: ${ADMIN_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAP_ID: ${ADMIN_GOOGLE_MAP_ID:-}
    environment:
      HOP_APP: admin
      BACKEND_UPSTREAM: api:8080
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set rider hostname}
      CAPTAIN_HOST: ${CAPTAIN_HOST:?Set captain hostname}
      ADMIN_HOST: ${ADMIN_HOST:?Set admin hostname}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      rider: {condition: service_started}
      captain: {condition: service_started}
      admin: {condition: service_started}
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
