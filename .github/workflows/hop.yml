name: Hop platform checks
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment (configure required reviewers for production)
        type: choice
        options: [staging, production]
        default: staging
      routing_image:
        description: Rebuild the road router image (OSRM, South India map data, about 30 min) instead of deploying
        type: boolean
        default: false
  push:
    # Strictly mobile & backend: hop-platform/web is deprecated and not built.
    paths: ['hop-platform/**', 'hop-mobile-platform/**', '.github/workflows/hop.yml']
  pull_request:
    paths: ['hop-platform/**', 'hop-mobile-platform/**', '.github/workflows/hop.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hop
          POSTGRES_DB: hop_test
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hop" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: hop-platform/backend
    env:
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgres://hop:integration-only@localhost:5432/hop_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Same Go as the API images (hop-platform/Dockerfile*), so CI tests and scans what ships.
          # Pinned exactly: a range like 1.26.x reuses the runner's cached patch and misses security fixes.
          go-version: '1.27.3'
          cache-dependency-path: hop-platform/backend/go.sum
      - run: go version
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build -trimpath -o "$RUNNER_TEMP/hop-api" ./cmd/api
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - run: govulncheck -mode=binary "$RUNNER_TEMP/hop-api"
  # ---------------------------------------------------------------------------
  # NOTE: The web-based application is NO LONGER USED.
  # Strictly mobile application support only:
  # - Hop Rider (com.hop.rider) and Hop Captain (com.hop.captain) are maintained
  #   and compiled exclusively from hop-mobile-platform/.
  # - The legacy hop-platform/web job below is commented out / deactivated.
  # ---------------------------------------------------------------------------
  # web:
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: hop-platform/web
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '24'
  #         cache: npm
  #         cache-dependency-path: hop-platform/web/package-lock.json
  #     - run: npm ci
  #     - run: npm run typecheck
  #     - run: npm run build
  #     - run: npx playwright install --with-deps chromium
  #     - run: npm run test:responsive
  #     - uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: responsive-browser-results
  #         path: |
  #           hop-platform/web/playwright-report/
  #           hop-platform/web/test-results/
  #         retention-days: 14
  #     - run: npm audit --omit=dev --audit-level=high
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hop-mobile-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hop-mobile-platform/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          chmod +x mobile/rider/android/gradlew mobile/captain/android/gradlew
      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('hop-mobile-platform/mobile/*/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install dependencies
        run: npm ci
      - name: Build Rider Android debug APK
        env:
          VITE_MOBILE_API_URL: ${{ vars.HOP_RIDER_API_URL || vars.HOP_API_URL || 'https://hop-staging-rider-qp262su4sq-el.a.run.app' }}
          VITE_DEV_MODE: 'true'
          VITE_MAP_PROVIDER: ${{ vars.RIDER_GOOGLE_MAPS_API_KEY != '' && 'google' || 'osm' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.RIDER_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ vars.RIDER_GOOGLE_MAP_ID }}
        run: node scripts/android.mjs rider --apk
      - name: Build Captain Android debug APK
        env:
          VITE_MOBILE_API_URL: ${{ vars.HOP_CAPTAIN_API_URL || vars.HOP_API_URL || 'https://hop-staging-captain-qp262su4sq-el.a.run.app' }}
          VITE_DEV_MODE: 'true'
          VITE_MAP_PROVIDER: ${{ vars.CAPTAIN_GOOGLE_MAPS_API_KEY != '' && 'google' || 'osm' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.CAPTAIN_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ vars.CAPTAIN_GOOGLE_MAP_ID }}
        run: node scripts/android.mjs captain --apk
      - name: Stage Android debug APKs
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp mobile/rider/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/artifacts/hop-rider-debug.apk"
          cp mobile/captain/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/artifacts/hop-captain-debug.apk"
          {
            echo "### 📱 Android Debug Applications (hop-mobile-platform)"
            echo ""
            echo "| Application | File | Artifact |"
            echo "|---|---|---|"
            echo "| 🚗 **Hop Rider** | \`hop-rider-debug.apk\` | **hop-rider-debug-apk** |"
            echo "| 🚕 **Hop Captain** | \`hop-captain-debug.apk\` | **hop-captain-debug-apk** |"
            echo ""
            echo "Directly download the debug APKs from the **Artifacts** section at the bottom of this run summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Rider Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hop-rider-debug-apk
          path: ${{ runner.temp }}/artifacts/hop-rider-debug.apk
          if-no-files-found: error

      - name: Archive Captain Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hop-captain-debug-apk
          path: ${{ runner.temp }}/artifacts/hop-captain-debug.apk
          if-no-files-found: error

      - name: Archive Combined Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: hop-android-apks
          path: ${{ runner.temp }}/artifacts/*.apk
          if-no-files-found: error
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s hop-platform/infra/gcp -p 'test_*.py'
  routing-image:
    # Manual only: rebuilds Hop's own road router (hop-platform/infra/osrm) with fresh map data.
    if: github.event_name == 'workflow_dispatch' && inputs.routing_image && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build the router image in Cloud Build
        env:
          DEPLOY_CONFIG: ${{ vars.HOP_DEPLOY_CONFIG }}
        run: |
          python3 -c 'import json,os,pathlib; c=json.loads(os.environ.get("DEPLOY_CONFIG") or pathlib.Path("hop-platform/infra/gcp/deploy.local.json").read_text()); print("\n".join(f"{k}={c[k]}" for k in ("project_id","region","repository","build_service_account")))' >> "$GITHUB_ENV"
          gcloud builds submit hop-platform/infra/osrm --config=hop-platform/infra/osrm/cloudbuild.yaml \
            --project="$project_id" --region="$region" \
            --service-account="projects/$project_id/serviceAccounts/$build_service_account" \
            --substitutions="_REGION=$region,_REPOSITORY=$repository,_DATA=$(date +%Y%m%d)"
          image="$region-docker.pkg.dev/$project_id/$repository/osrm"
          gcloud artifacts docker tags add "$image:$(date +%Y%m%d)" "$image:current" --project="$project_id"
          echo "Router image: $image:current (set \"osrm_image\" to this in HOP_DEPLOY_CONFIG)" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    # 'web' job removed: web-based application is deprecated in favor of hop-mobile-platform
    needs: [api, android, deployment-config]
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.routing_image && github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    concurrency:
      group: hop-deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate environment configuration
        env:
          DEPLOY_CONFIG: ${{ vars.HOP_DEPLOY_CONFIG }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" && test -n "$DEPLOY_ACCOUNT"
          python -c 'import os,pathlib; cfg = os.environ.get("DEPLOY_CONFIG") or pathlib.Path("hop-platform/infra/gcp/deploy.local.json").read_text(); pathlib.Path(os.environ["RUNNER_TEMP"], "hop-deploy.json").write_text(cfg)'
          python hop-platform/infra/gcp/deploy.py "$RUNNER_TEMP/hop-deploy.json" --validate-only
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build, deploy and check gateways
        run: python hop-platform/infra/gcp/deploy.py "$RUNNER_TEMP/hop-deploy.json" --revision "$GITHUB_SHA"
