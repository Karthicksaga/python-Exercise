name: Hop platform checks
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment (configure required reviewers for production)
        type: choice
        options: [staging, production]
        default: staging
  push:
    paths: ['hop-platform/**', '.github/workflows/hop.yml']
  pull_request:
    paths: ['hop-platform/**', '.github/workflows/hop.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hop
          POSTGRES_DB: hop_test
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hop" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: hop-platform/backend
    env:
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgres://hop:integration-only@localhost:5432/hop_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hop-platform/backend/go.mod
          cache-dependency-path: hop-platform/backend/go.sum
      - run: go version
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build -trimpath -o "$RUNNER_TEMP/hop-api" ./cmd/api
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - run: govulncheck -mode=binary "$RUNNER_TEMP/hop-api"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hop-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hop-platform/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hop-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hop-platform/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          chmod +x mobile/rider/android/gradlew mobile/captain/android/gradlew
      - name: Install dependencies
        run: npm ci
      - name: Build Rider Android debug APK
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.RIDER_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ vars.RIDER_GOOGLE_MAP_ID }}
        run: node scripts/android.mjs rider --apk
      - name: Build Captain Android debug APK
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.CAPTAIN_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ vars.CAPTAIN_GOOGLE_MAP_ID }}
        run: node scripts/android.mjs captain --apk
      - name: Archive Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: hop-android-apks
          path: |
            hop-platform/web/mobile/rider/android/app/build/outputs/apk/debug/app-debug.apk
            hop-platform/web/mobile/captain/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s hop-platform/infra/gcp -p 'test_*.py'
  deploy:
    needs: [api, web, android, deployment-config]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.HOP_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    concurrency:
      group: hop-deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate environment configuration
        env:
          DEPLOY_CONFIG: ${{ vars.HOP_DEPLOY_CONFIG }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" && test -n "$DEPLOY_ACCOUNT"
          python -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "hop-deploy.json").write_text(os.environ["DEPLOY_CONFIG"])'
          python hop-platform/infra/gcp/deploy.py "$RUNNER_TEMP/hop-deploy.json" --validate-only
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build, deploy and check gateways
        run: python hop-platform/infra/gcp/deploy.py "$RUNNER_TEMP/hop-deploy.json" --revision "$GITHUB_SHA"
