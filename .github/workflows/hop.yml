name: Hop platform checks
on:
  push:
    paths: ['hop-platform/**', '.github/workflows/hop.yml']
  pull_request:
    paths: ['hop-platform/**', '.github/workflows/hop.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hop
          POSTGRES_DB: hop_test
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hop" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: hop-platform/backend
    env:
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgres://hop:integration-only@localhost:5432/hop_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hop-platform/backend/go.mod
          cache-dependency-path: hop-platform/backend/go.sum
      - run: go version
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build -trimpath -o "$RUNNER_TEMP/hop-api" ./cmd/api
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - run: govulncheck -mode=binary "$RUNNER_TEMP/hop-api"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hop-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hop-platform/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
