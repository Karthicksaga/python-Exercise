name: Hop Mobile Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Debug APK for testing, or signed release APK + AAB
        type: choice
        options: [debug, release]
        default: debug
      target_app:
        description: Application to build
        type: choice
        options: [all, rider, captain]
        default: all
  push:
    branches: [main, master, 'codex/**']
    paths:
      - 'hop-mobile-platform/**'
      - 'hop-platform/prototypes/mobile-first/**'
      - '.github/workflows/hop-mobile.yml'
  pull_request:
    paths:
      - 'hop-mobile-platform/**'
      - 'hop-platform/prototypes/mobile-first/**'
      - '.github/workflows/hop-mobile.yml'

permissions:
  contents: read

concurrency:
  group: hop-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Typecheck, builds and mobile regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hop-mobile-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hop-mobile-platform/package-lock.json
      - run: npm ci
      - run: node --test scripts/ci.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:design
      - name: Upload failed visual checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: hop-mobile-platform/test-results
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android ${{ matrix.app }}
    needs: validate
    # Pull requests run validation without exposing deployment/signing secrets.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [rider, captain]
        exclude: ${{ fromJSON(inputs.target_app == 'rider' && '[{"app":"captain"}]' || inputs.target_app == 'captain' && '[{"app":"rider"}]' || '[]') }}
    defaults:
      run:
        working-directory: hop-mobile-platform
    env:
      APP: ${{ matrix.app }}
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      VITE_MOBILE_API_URL: ${{ (matrix.app == 'rider' && vars.HOP_RIDER_API_URL || matrix.app == 'captain' && vars.HOP_CAPTAIN_API_URL) || vars.HOP_API_URL }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.HOP_GOOGLE_MAPS_API_KEY }}
      HOP_VERSION_CODE: ${{ github.run_number }}
      HOP_VERSION_NAME: 1.0.${{ github.run_number }}
      HOP_BUILD_ID: ${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hop-mobile-platform/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install required Android SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - name: Validate device backend and prepare build credentials
        env:
          RIDER_GOOGLE_SERVICES: ${{ secrets.HOP_RIDER_GOOGLE_SERVICES_JSON_BASE64 }}
          CAPTAIN_GOOGLE_SERVICES: ${{ secrets.HOP_CAPTAIN_GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.HOP_ANDROID_KEYSTORE_BASE64 }}
          HOP_ANDROID_STORE_PASSWORD: ${{ secrets.HOP_ANDROID_STORE_PASSWORD }}
          HOP_ANDROID_KEY_ALIAS: ${{ secrets.HOP_ANDROID_KEY_ALIAS }}
          HOP_ANDROID_KEY_PASSWORD: ${{ secrets.HOP_ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-ci.mjs
      - name: Build native application
        env:
          HOP_ANDROID_KEYSTORE: ${{ runner.temp }}/hop-signing.jks
          HOP_ANDROID_STORE_PASSWORD: ${{ secrets.HOP_ANDROID_STORE_PASSWORD }}
          HOP_ANDROID_KEY_ALIAS: ${{ secrets.HOP_ANDROID_KEY_ALIAS }}
          HOP_ANDROID_KEY_PASSWORD: ${{ secrets.HOP_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x "mobile/$APP/android/gradlew"
          if [ "$BUILD_TYPE" = release ]; then
            node scripts/android.mjs "$APP" --release --apk
          else
            node scripts/android.mjs "$APP" --apk
          fi
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "mobile/$APP/android/app/build/outputs/apk/$BUILD_TYPE/app-$BUILD_TYPE.apk"'
      - name: Verify release bundle signature
        if: env.BUILD_TYPE == 'release'
        run: jarsigner -verify "mobile/$APP/android/app/build/outputs/bundle/release/app-release.aab"
      - name: Stage and checksum installable outputs
        run: node scripts/stage-android.mjs
      - name: Downloadable Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hop-${{ matrix.app }}-${{ env.BUILD_TYPE }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hop-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing and Firebase files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hop-signing.jks"
          rm -f "mobile/$APP/android/app/google-services.json"
