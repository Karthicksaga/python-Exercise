# Current Go application. Add secrets in Render, never in this file.
# Setup: hop-platform/docs/RENDER.md
services:
  - type: web
    name: hop-bike-taxi
    branch: feat/production-web-foundation
    rootDir: hop-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: ADDRESS
        value: ':10000'
      - key: MIGRATE_ON_START
        value: 'true'
      - key: SESSION_KEY
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: ROUTING_URL
        sync: false
      - key: GEOCODING_URL
        sync: false
